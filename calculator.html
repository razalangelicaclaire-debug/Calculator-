<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffe6f0;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 310px;
    background: #ffb6d2;
    padding: 22px;
    border-radius: 30px;
    box-shadow: 0 10px 20px #d98ba9;
    position: relative;
    margin-top: 35px;
}

/* Cat Ears */
.ears {
    position: absolute;
    top: -42px;
    left: 35px;
    right: 35px;
    display: flex;
    justify-content: space-between;
}

.ear {
    width: 65px;
    height: 75px;
    background: #ff9fc5;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    position: relative;
}

.ear::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 40px;
    background: #ffdfeb;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    top: 22px;
    left: 15px;
}

h2 {
    text-align: center;
    color: white;
    margin: 15px 0;
    letter-spacing: 2px;
}

.screen {
    width: 100%;
    height: 75px;
    background: #fff0f6;
    border: none;
    border-radius: 15px;
    margin-bottom: 18px;
    text-align: right;
    padding: 15px;
    font-size: 28px;
    color: #d94e88;
    outline: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 55px;
    border: none;
    border-radius: 15px;
    background: #fff0f6;
    color: #d94e88;
    font-size: 21px;
    font-weight: bold;
    box-shadow: 0 3px 5px #dc8eae;
    cursor: pointer;
}

button:active {
    transform: scale(0.92);
}

.operator {
    background: #ff80b3;
    color: white;
}

.equal {
    background: #e94f91;
    color: white;
    grid-row: span 2;
    height: 120px;
}

.zero {
    grid-column: span 2;
}

.footer {
    text-align: center;
    color: white;
    margin-top: 18px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="ears">
        <div class="ear"></div>
        <div class="ear"></div>
    </div>

    <h2></h2>

    <input type="text" class="screen" id="screen"
    value="0" readonly>

    <div class="buttons">

        <button onclick="clearScreen()">AC</button>
        <button onclick="del()">⌫</button>
        <button onclick="add('%')" class="operator">%</button>
        <button onclick="add('/')" class="operator">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('*')" class="operator">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('-')" class="operator">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('+')" class="operator">+</button>

        <button onclick="add('0')" class="zero">0</button>
        <button onclick="add('.')">.</button>
        <button onclick="calculate()" class="equal">=</button>

    </div>

    <div class="footer">
        
    </div>

</div>

<script>
let screen = document.getElementById("screen");

function add(value) {
    if (screen.value === "Error") {
        screen.value = "";
    }

    if (screen.value === "0") {
        screen.value = value;
    } else {
        screen.value += value;
    }
}

function clearScreen() {
    screen.value = "0";
}

function del() {
    screen.value = screen.value.slice(0, -1) || "0";
}

function calculate() {
    try {
        let expression = screen.value;

        if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
            throw new Error();
        }

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        screen.value = Number.isFinite(result)
            ? String(Number(result.toPrecision(10)))
            : "Error";

    } catch {
        screen.value = "Error";
    }
}
</script>

</body>
</html>
